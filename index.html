<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STRIKE//OPS</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#05070a;font-family:Arial;color:#fff}canvas{display:block}#menu{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.72);z-index:5}#panel{padding:34px 42px;background:#10151d;border:1px solid #344252;text-align:center}button{padding:15px 30px;font-size:18px;font-weight:bold;cursor:pointer}#hud{position:fixed;left:20px;top:18px;z-index:3;display:none;text-shadow:0 2px 3px #000}#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);z-index:4;display:none;pointer-events:none}.h,.v{position:absolute;background:white}.h{width:18px;height:2px;top:8px}.v{height:18px;width:2px;left:8px}#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:3;display:none;color:#ddd}</style></head><body><div id="menu"><div id="panel"><h1>STRIKE//OPS</h1><p>Original browser FPS prototype</p><button id="start">CLICK TO DEPLOY</button></div></div><div id="hud">HP: <b id="hp">100</b> &nbsp; AMMO: <b id="ammo">30</b>/120 &nbsp; KILLS: <b id="kills">0</b></div><div id="cross"><i class="h"></i><i class="v"></i></div><div id="hint">WASD move · Mouse look · Left click shoot · R reload · Shift sprint · Esc unlock mouse</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const menu=document.getElementById('menu'),start=document.getElementById('start'),hud=document.getElementById('hud'),cross=document.getElementById('cross'),hint=document.getElementById('hint');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x071018); scene.fog=new THREE.Fog(0x071018,20,90);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,150); camera.position.set(0,1.7,12);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xbddcff,0x202020,2)); const sun=new THREE.DirectionalLight(0xffffff,2); sun.position.set(10,20,10); scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x26313a,roughness:.9})); floor.rotation.x=-Math.PI/2; scene.add(floor);
const grid=new THREE.GridHelper(100,50,0x40515f,0x202b34); grid.position.y=.01; scene.add(grid);
function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c}));m.position.set(x,y,z);scene.add(m);return m}
box(0,2,-22,44,4,1,0x18242d);box(-22,2,0,1,4,44,0x18242d);box(22,2,0,1,4,44,0x18242d);box(0,2,22,44,4,1,0x18242d);box(-7,1,-5,6,2,2,0x43505a);box(7,1,-10,5,2,2,0x43505a);box(-5,1,7,3,2,4,0x43505a);box(8,1,5,4,2,3,0x43505a);
// weapon
const gun=new THREE.Group(); const body=box(0,0,0,1,1,1,0x20252b); scene.remove(body); body.position.set(.42,-.34,-.8); body.scale.set(.32,.2,.8); gun.add(body); const barrel=box(0,0,0,1,1,1,0x11151a);scene.remove(barrel);barrel.position.set(.42,-.31,-1.25);barrel.scale.set(.09,.09,.65);gun.add(barrel);camera.add(gun);scene.add(camera);
const keys={}; let yaw=0,pitch=0,locked=false,queuedShot=false,ammo=30,kills=0,hp=100; const enemies=[];
function makeEnemy(x,z){const g=new THREE.Group();g.position.set(x,0,z);const mat=new THREE.MeshStandardMaterial({color:0xc43b3b});const dark=new THREE.MeshStandardMaterial({color:0x242832});
 const torso=new THREE.Mesh(new THREE.BoxGeometry(.8,1.25,.45),mat);torso.position.y=1.15;g.add(torso);const head=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),new THREE.MeshStandardMaterial({color:0xd7a07b}));head.position.y=2.02;g.add(head);for(const sx of [-.58,.58]){const a=new THREE.Mesh(new THREE.BoxGeometry(.25,1.05,.25),mat);a.position.set(sx,1.15,0);g.add(a)}for(const sx of [-.23,.23]){const l=new THREE.Mesh(new THREE.BoxGeometry(.28,1,.3),dark);l.position.set(sx,.45,0);g.add(l)}g.userData={hp:3,hit:0};scene.add(g);enemies.push(g)}
makeEnemy(-9,-15);makeEnemy(8,-18);makeEnemy(-10,-2);makeEnemy(11,0);makeEnemy(2,-8);
const ray=new THREE.Raycaster();
function shoot(){if(!locked||ammo<=0)return;ammo--;updateHUD();ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(enemies,true);if(hits.length){let e=hits[0].object;while(e.parent&&!e.userData.hp)e=e.parent;if(e.userData.hp){e.userData.hp--;e.userData.hit=.12;if(e.userData.hp<=0){scene.remove(e);enemies.splice(enemies.indexOf(e),1);kills++;updateHUD()}}}}
function updateHUD(){document.getElementById('ammo').textContent=ammo;document.getElementById('kills').textContent=kills;document.getElementById('hp').textContent=hp}
function lockMouse(){try{renderer.domElement.requestPointerLock()}catch(err){console.warn(err)}}
start.onclick=()=>{menu.style.display='none';hud.style.display='block';cross.style.display='block';hint.style.display='block';renderer.domElement.focus();queuedShot=true;lockMouse()};
document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;if(locked&&queuedShot){queuedShot=false;setTimeout(shoot,30)}});
document.addEventListener('mousemove',e=>{if(!locked)return; yaw-=e.movementX*.0026; pitch-=e.movementY*.0026;pitch=Math.max(-1.45,Math.min(1.45,pitch));camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR'&&ammo<30){ammo=30;updateHUD()}});document.addEventListener('keyup',e=>keys[e.code]=false);document.addEventListener('mousedown',e=>{if(e.button!==0)return;if(!locked){queuedShot=true;lockMouse()}else shoot()});
document.addEventListener('contextmenu',e=>e.preventDefault());
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;let speed=keys.ShiftLeft?8:5;let f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0);if(locked&&(f||s)){const dir=new THREE.Vector3(s,0,-f).normalize().applyAxisAngle(new THREE.Vector3(0,1,0),yaw);camera.position.addScaledVector(dir,speed*dt)}camera.position.x=Math.max(-20,Math.min(20,camera.position.x));camera.position.z=Math.max(-20,Math.min(20,camera.position.z));for(const e of [...enemies]){const dx=camera.position.x-e.position.x,dz=camera.position.z-e.position.z,dist=Math.hypot(dx,dz);if(dist>2.2){e.position.x+=dx/dist*dt*1.15;e.position.z+=dz/dist*dt*1.15}else if(Math.random()<dt*.8){hp=Math.max(0,hp-5);updateHUD()}}renderer.render(scene,camera)}requestAnimationFrame(loop);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});updateHUD();
</script></body></html>
